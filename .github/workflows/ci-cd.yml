name: StreamRoom CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Проверка backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streamroom_test
          POSTGRES_USER: streamroom_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamroom_test -d streamroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: streamroom_test
      DATABASE_USER: streamroom_test
      DATABASE_PASSWORD: test_password
      OWNCAST_PUBLIC_URL: http://localhost:8081
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установить зависимости
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Запустить тесты API
        run: python -m pytest -q backend/tests

      - name: Проверить JavaScript
        run: node --check frontend/site/app.js

  publish:
    name: Сборка и публикация образов
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить имя владельца образов
        shell: bash
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-backend:latest

      - name: Собрать и опубликовать frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-frontend:latest

      - name: Собрать и опубликовать gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-gateway:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/streamroom-gateway:latest

  deploy:
    name: Развёртывание в Docker Swarm
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Проверить настройки удалённого развёртывания
        id: settings
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_PATH: ${{ secrets.SWARM_PATH }}
        shell: bash
        run: |
          if [ -z "$SWARM_HOST" ] || [ -z "$SWARM_USER" ] || [ -z "$SWARM_SSH_KEY" ] || [ -z "$SWARM_PATH" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Образы опубликованы. Удалённое развёртывание пропущено: параметры SSH отсутствуют." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Получить версию конфигурации для этого коммита
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Обновить стек и проверить API
        if: steps.settings.outputs.ready == 'true'
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_PATH: ${{ secrets.SWARM_PATH }}
          SWARM_KNOWN_HOSTS: ${{ secrets.SWARM_KNOWN_HOSTS }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SWARM_SSH_KEY" > "$HOME/.ssh/streamroom_key"
          chmod 600 "$HOME/.ssh/streamroom_key"

          if [ -n "$SWARM_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SWARM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$SWARM_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          OWNER_LOWER=$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          STACK_BASE64=$(base64 -w 0 docker-stack.yml)
          REMOTE_PATH=$(printf '%q' "$SWARM_PATH")
          ssh -i "$HOME/.ssh/streamroom_key" -o StrictHostKeyChecking=yes "$SWARM_USER@$SWARM_HOST" \
            "cd $REMOTE_PATH && bash -s -- '$OWNER_LOWER' '$IMAGE_TAG' '$STACK_BASE64'" < deploy/update-swarm.sh
